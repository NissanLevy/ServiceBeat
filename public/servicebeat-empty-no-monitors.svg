<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80">
  <!-- Radar rings -->
  <circle cx="40" cy="40" r="34" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="40" cy="40" r="22" fill="none" stroke="#1F2937" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="40" cy="40" r="10" fill="none" stroke="#374151" stroke-width="1.5"/>
  <!-- Center dot -->
  <circle cx="40" cy="40" r="3" fill="#4B5563"/>
  <!-- Crosshairs -->
  <line x1="40" y1="4" x2="40" y2="76" stroke="#1F2937" stroke-width="1"/>
  <line x1="4" y1="40" x2="76" y2="40" stroke="#1F2937" stroke-width="1"/>
  <!-- Radar sweep line -->
  <line x1="40" y1="40" x2="68" y2="18" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Small blip dot -->
  <circle cx="62" cy="24" r="2.5" fill="#6B7280" opacity="0.5"/>
</svg>
