<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 56" width="256" height="56">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield icon — larger, vertically centered -->
  <g transform="translate(0, 0)">
    <path d="M26 0 L52 10 L52 33 C52 47.5 39 57.5 26 63 C13 57.5 0 47.5 0 33 L0 10 Z"
          fill="rgba(255,255,255,0.06)" stroke="rgba(16,185,129,0.25)" stroke-width="0.75"/>
    <!-- Pulse line -->
    <line x1="6" y1="33.5" x2="12" y2="33.5" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
    <polyline points="12,33.5 15,33.5 18,43 22,23 25,33.5 26,33.5 27,33.5 30,43 34,23 37,33.5 40,33.5"
              fill="none" stroke="#10B981" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="40" y1="33.5" x2="46" y2="33.5" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="26" cy="8" r="2.2" fill="#10B981" opacity="0.9"/>
  </g>

  <!-- Wordmark — tighter letter-spacing, vertically centered -->
  <text x="62" y="37"
        font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="26" font-weight="600" letter-spacing="-1">
    <tspan fill="#F9FAFB">Service</tspan><tspan fill="#10B981">Beat</tspan>
  </text>
</svg>
