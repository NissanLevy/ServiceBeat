<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 110" width="480" height="110">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@600&amp;family=Space+Mono:wght@400&amp;display=swap');
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Shield icon -->
  <g transform="translate(10, 5)">
    <path d="M40 0 L80 15 L80 50 C80 72 60 87 40 97 C20 87 0 72 0 50 L0 15 Z"
          fill="#111827"/>
    <path d="M40 6 L74 19 L74 50 C74 69 56 83 40 91 C24 83 6 69 6 50 L6 19 Z"
          fill="none" stroke="#1F2937" stroke-width="1"/>
    <!-- Pulse line -->
    <line x1="9" y1="51" x2="19" y2="51" stroke="#10B981" stroke-width="2.8" stroke-linecap="round" filter="url(#glow)"/>
    <polyline points="19,51 23,51 27,64 33,36 38,51 40,51 42,51 47,64 53,36 57,51 61,51"
              fill="none" stroke="#10B981" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
    <line x1="61" y1="51" x2="71" y2="51" stroke="#10B981" stroke-width="2.8" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="40" cy="12" r="3" fill="#10B981" opacity="0.8"/>
  </g>

  <!-- Wordmark -->
  <text x="106" y="64"
        font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="48" font-weight="600" fill="#111827" letter-spacing="-0.5">Service</text>
  <text x="326" y="64"
        font-family="'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif"
        font-size="48" font-weight="600" fill="#10B981" letter-spacing="-0.5">Beat</text>

  <!-- Tagline -->
  <text x="107" y="84"
        font-family="'Space Mono', 'Courier New', monospace"
        font-size="11" fill="#9CA3AF" letter-spacing="0.12em">MONITOR · ALERT · RESPOND</text>
</svg>
